<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>+90 | منصتك الاحترافية</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg-dark:#000;--bg-deep:#050508;--bg-elevated:#121118;--bg-card:rgba(18,17,24,0.75);--accent-lavender:#C7B9FF;--accent-soft-purple:#9F8BFF;--accent-deep-purple:#6B4EFF;--accent-glow:#8A6CFF;--text-primary:#FFF;--text-secondary:#B0B0C0;--text-muted:#707080;--border-dim:rgba(255,255,255,0.07);--border-glow:rgba(159,139,255,0.35);--shadow-intense:0 25px 50px -12px rgba(0,0,0,0.85);--shadow-soft:0 15px 35px -10px rgba(106,78,255,0.35);--shadow-card:0 10px 30px -15px rgba(0,0,0,0.6);--blur-xl:blur(30px);--blur-lg:blur(20px);--blur-card:blur(15px);--transition-smooth:all 0.25s cubic-bezier(0.4,0,0.2,1);--nav-height:68px;--card-radius:22px;--button-radius:28px;--space-1:8px;--space-2:16px;--space-3:24px;--space-4:32px;--space-5:40px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Tajawal','Cairo','Readex Pro',sans-serif}
body{background:var(--bg-dark);color:var(--text-primary);width:100%;height:100%;min-height:100vh;font-weight:400;overflow:hidden}
.app-container{width:100%;height:100%;background:var(--bg-deep);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:none;margin:0}
.screen{display:none;flex-direction:column;height:100%;width:100%;position:absolute;top:0;left:0;background:var(--bg-deep);opacity:0;transition:opacity 0.2s ease;z-index:1;overflow-y:auto}
.screen.active{display:flex;z-index:10;opacity:1}
.ripple-container{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;border-radius:inherit;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.5);transform:scale(0);animation:ripple-animation 0.6s ease-out}
@keyframes ripple-animation{to{transform:scale(4);opacity:0}}
.lang-switch-btn{position:absolute;top:20px;left:20px;background:rgba(255,255,255,0.1);backdrop-filter:var(--blur-lg);border:1px solid var(--border-glow);border-radius:50px;padding:10px 16px;color:var(--accent-lavender);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;z-index:20;transition:var(--transition-smooth)}
.lang-switch-btn:active{background:var(--accent-deep-purple);color:#fff}
.lang-switch-btn i{font-size:16px}
.auth-container{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:var(--space-3) var(--space-2);background:radial-gradient(circle at 50% 0%,#2A2355,var(--bg-deep) 70%);position:relative}
.auth-header{text-align:center;margin-bottom:var(--space-5)}
.auth-header h1{font-size:56px;font-weight:900;background:linear-gradient(145deg,var(--accent-lavender),var(--accent-deep-purple));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-2px;line-height:1.1;filter:drop-shadow(0 10px 20px rgba(106,78,255,0.4))}
.auth-header p{color:var(--text-secondary);font-size:16px;font-weight:500;margin-top:var(--space-1)}
.auth-app-image{width:120px;height:120px;margin:0 auto var(--space-3);border-radius:30px;overflow:hidden;border:2px solid var(--border-glow);box-shadow:var(--shadow-soft)}
.auth-app-image img{width:100%;height:100%;object-fit:cover}
.input-group-modern{margin-bottom:var(--space-2);position:relative}
.input-group-modern i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--accent-soft-purple);font-size:18px;transition:var(--transition-smooth);z-index:2}
.input-group-modern input,.input-group-modern textarea{width:100%;padding:16px 50px 16px 20px;background:rgba(255,255,255,0.03);border:1.5px solid var(--border-dim);border-radius:var(--button-radius);color:var(--text-primary);font-size:15px;font-weight:400;outline:none;transition:var(--transition-smooth);backdrop-filter:var(--blur-lg)}
.input-group-modern textarea{border-radius:var(--button-radius);resize:none}
.input-group-modern input:focus,.input-group-modern textarea:focus{border-color:var(--accent-soft-purple);background:rgba(159,139,255,0.05);box-shadow:0 0 0 4px rgba(159,139,255,0.2)}
.btn-gradient{position:relative;overflow:hidden;width:100%;padding:14px;background:linear-gradient(135deg,var(--accent-soft-purple),var(--accent-deep-purple));color:#fff;border:none;border-radius:var(--button-radius);font-size:16px;font-weight:700;cursor:pointer;transition:var(--transition-smooth);box-shadow:0 10px 30px -5px var(--accent-deep-purple);border:1px solid var(--border-glow);margin-top:10px}
.btn-gradient:active{transform:scale(0.97);box-shadow:0 5px 20px -2px var(--accent-glow)}
.btn-gradient:disabled{opacity:0.5;transform:none;box-shadow:none;cursor:not-allowed}
.auth-switch{margin-top:var(--space-3);text-align:center;color:var(--text-secondary);font-size:14px;display:flex;align-items:center;justify-content:center;gap:var(--space-1)}
.text-link{background:transparent;border:none;color:var(--accent-lavender);font-size:15px;font-weight:700;cursor:pointer;padding:6px 12px;border-radius:40px;transition:var(--transition-smooth)}
.text-link:active{background:rgba(199,185,255,0.15)}
.home-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:60px;background:rgba(5,5,5,0.7);backdrop-filter:var(--blur-xl);border-bottom:1px solid var(--border-dim);position:sticky;top:0;z-index:15}
.home-header-left{font-size:24px;color:var(--accent-lavender);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition-smooth)}
.home-header-left:active{background:rgba(199,185,255,0.15)}
.home-header-center{font-size:30px;font-weight:900;background:linear-gradient(145deg,var(--accent-lavender),var(--accent-deep-purple));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.home-header-right{font-size:24px;color:var(--accent-lavender);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition-smooth)}
.home-header-right:active{background:rgba(199,185,255,0.15)}
.stories-container{padding:12px 0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;border-bottom:1px solid var(--border-dim);background:transparent}
.stories-container::-webkit-scrollbar{display:none}
.stories-scroll{display:inline-flex;gap:16px;padding:0 16px}
.story-item{display:inline-flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:68px;flex-shrink:0}
.story-avatar{width:68px;height:68px;border-radius:50%;padding:2px;background:linear-gradient(145deg,var(--accent-lavender),var(--accent-deep-purple));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft)}
.story-avatar-inner{width:100%;height:100%;border-radius:50%;background:var(--bg-deep);overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-deep)}
.story-avatar-inner img{width:100%;height:100%;object-fit:cover}
.story-avatar-inner i{font-size:30px;color:var(--text-secondary)}
.story-username{font-size:11px;font-weight:500;color:var(--text-secondary);max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-add{background:rgba(159,139,255,0.3);border:2px dashed var(--accent-soft-purple)}
.story-add .story-avatar-inner{background:transparent;border:none}
.story-add i{font-size:30px;color:var(--accent-lavender)}
.main-tab-content{display:none;flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-height) + 10px);scrollbar-width:thin;scrollbar-color:var(--accent-soft-purple) var(--bg-elevated)}
.main-tab-content.active{display:block}
#home-feed{display:flex;flex-direction:column;gap:16px;padding:16px 12px}
.post-card{background:var(--bg-card);backdrop-filter:var(--blur-card);border-radius:var(--card-radius);border:1px solid var(--border-dim);overflow:hidden;box-shadow:var(--shadow-card);transition:var(--transition-smooth)}
.post-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.post-user{display:flex;align-items:center;gap:10px;cursor:pointer}
.post-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,var(--accent-soft-purple),var(--accent-deep-purple));display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid var(--border-glow)}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-name{font-weight:700;font-size:15px}
.post-username{font-size:12px;color:var(--text-secondary)}
.post-options{font-size:20px;color:var(--text-muted);cursor:pointer;padding:5px}
.post-media{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer}
.post-media video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.video-progress-bar{position:absolute;bottom:40px;left:10px;right:10px;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;cursor:pointer;z-index:10;opacity:0;transition:opacity 0.2s}
.post-media:hover .video-progress-bar,.post-media.video-controls-visible .video-progress-bar{opacity:1}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-lavender),var(--accent-deep-purple));border-radius:2px;width:0%;pointer-events:none}
.video-controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;align-items:center;gap:10px;z-index:10;opacity:0;transition:opacity 0.2s;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);padding:8px 12px;border-radius:30px;backdrop-filter:var(--blur-lg)}
.post-media:hover .video-controls,.post-media.video-controls-visible .video-controls{opacity:1}
.video-controls button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition-smooth);text-shadow:0 2px 5px #000}
.video-controls button:active{background:rgba(255,255,255,0.2);transform:scale(0.95)}
.video-controls .time-display{flex:1;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000}
.post-actions{display:flex;align-items:center;gap:20px;padding:12px 16px}
.post-action{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:22px;cursor:pointer;transition:var(--transition-smooth)}
.post-action span{font-size:14px;font-weight:500}
.post-action.liked i{color:#ff4d6d;animation:likePop 0.2s ease}
.post-caption{padding:0 16px 12px;font-size:14px;line-height:1.5;color:var(--text-primary)}
.post-caption strong{color:var(--accent-lavender);margin-left:6px}
.post-caption a{color:var(--accent-soft-purple);text-decoration:none;font-weight:600}
.post-comments-preview{padding:0 16px 16px;font-size:13px;color:var(--text-muted);cursor:pointer}
.post-time{font-size:11px;color:var(--text-muted);padding:0 16px 16px}
@keyframes likePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.skeleton-card{background:rgba(30,30,30,0.5);backdrop-filter:var(--blur-card);border-radius:var(--card-radius);padding:16px;margin-bottom:16px;border:1px solid var(--border-dim);animation:skeleton-pulse 1.5s ease-in-out infinite}
@keyframes skeleton-pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.skeleton-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.skeleton-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);animation:skeleton-pulse 1.5s infinite}
.skeleton-line{height:16px;background:linear-gradient(90deg,rgba(255,255,255,0.05) 25%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.05) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;flex:1}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton-media{width:100%;aspect-ratio:16/9;background:rgba(255,255,255,0.05);border-radius:16px;margin:12px 0;animation:skeleton-pulse 1.5s infinite}
.skeleton-actions{display:flex;gap:20px;margin:12px 0}
.skeleton-action{width:30px;height:30px;background:rgba(255,255,255,0.1);border-radius:50%;animation:skeleton-pulse 1.5s infinite}
.messages-header{padding:var(--space-3) var(--space-2) var(--space-2);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,var(--bg-deep) 70%,transparent);position:sticky;top:0;z-index:5}
.messages-header h2{font-size:28px;font-weight:900;background:linear-gradient(145deg,var(--accent-lavender),var(--accent-soft-purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.notification-bell{position:relative;font-size:26px;color:var(--accent-lavender);cursor:pointer;padding:var(--space-1)}
.notification-badge{position:absolute;top:0;right:0;background:#ff4d6d;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg-deep)}
.card-item{display:flex;align-items:center;padding:var(--space-2) var(--space-2);margin:var(--space-1) var(--space-2);background:var(--bg-elevated);border-radius:var(--card-radius);border:1px solid var(--border-dim);cursor:pointer;transition:var(--transition-smooth);backdrop-filter:var(--blur-lg);box-shadow:0 5px 15px -8px rgba(0,0,0,0.5)}
.card-item:active{transform:scale(0.98);border-color:var(--accent-soft-purple);background:#1A1A1A}
.avatar-modern{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,var(--accent-soft-purple),var(--accent-deep-purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;margin-left:14px;border:2px solid var(--border-glow);overflow:hidden;box-shadow:0 5px 15px rgba(106,78,255,0.4);flex-shrink:0}
.avatar-modern img{width:100%;height:100%;object-fit:cover}
.item-info{flex:1}
.item-info h4{font-size:16px;font-weight:700;margin-bottom:2px;color:var(--text-primary)}
.item-info p{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;font-weight:400}
.user-status{font-size:10px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:3px}
.user-status.online{color:#4CAF50}
.user-status.online i{font-size:8px}
.item-meta{font-size:10px;color:var(--text-muted);margin-right:var(--space-1);white-space:nowrap}
.empty-state-modern{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--text-muted);text-align:center;padding:var(--space-3)}
.empty-state-modern i{font-size:80px;background:linear-gradient(145deg,var(--accent-lavender),var(--accent-deep-purple));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:var(--space-3);opacity:0.5}
.empty-state-modern h3{font-size:22px;font-weight:700;color:var(--text-secondary)}
.header-modern{padding:15px 20px;display:flex;align-items:center;gap:20px;background:rgba(5,5,5,0.8);backdrop-filter:var(--blur-xl);border-bottom:1px solid var(--border-dim);position:sticky;top:0;z-index:10}
.header-modern .back-btn{font-size:26px;color:var(--accent-lavender);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition-smooth)}
.header-modern .back-btn:active{background:rgba(199,185,255,0.15)}
.header-modern h2{font-size:24px;font-weight:900;background:linear-gradient(145deg,var(--accent-lavender),var(--accent-soft-purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.profile-header-modern{padding:var(--space-3) var(--space-2) 15px;background:linear-gradient(145deg,#1A1A1A,var(--bg-deep));border-bottom:1px solid var(--border-dim);text-align:center;position:relative;border-radius:0 0 var(--card-radius) var(--card-radius)}
.profile-avatar-large{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;border:4px solid transparent;background:linear-gradient(var(--bg-elevated),var(--bg-elevated)) padding-box,linear-gradient(145deg,var(--accent-lavender),var(--accent-deep-purple)) border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 35px -5px var(--accent-deep-purple);cursor:pointer}
.profile-avatar-large img{width:100%;height:100%;object-fit:cover}
.profile-avatar-large i{font-size:40px;color:var(--text-secondary)}
.profile-name-large{font-size:22px;font-weight:700;margin-bottom:2px;background:linear-gradient(145deg,var(--accent-lavender),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.profile-username-large{font-size:14px;color:var(--accent-soft-purple);margin-bottom:8px;cursor:pointer}
.profile-bio{font-size:14px;color:var(--text-secondary);margin-bottom:12px;padding:0 20px;max-width:100%;word-wrap:break-word}
.profile-website{display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:12px;font-size:14px}
.profile-website a{color:var(--accent-lavender);text-decoration:none;font-weight:600}
.profile-verified{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(145deg,var(--accent-soft-purple),var(--accent-deep-purple));color:#fff;padding:4px 10px;border-radius:30px;font-size:12px;margin-bottom:12px}
.stats-row{display:flex;justify-content:center;gap:var(--space-3);background:rgba(0,0,0,0.25);backdrop-filter:var(--blur-lg);border-radius:50px;padding:var(--space-1) 20px;border:1px solid var(--border-dim);width:fit-content;margin:0 auto 12px}
.stat-item-row{display:flex;align-items:center;gap:5px;color:var(--text-secondary);font-size:13px}
.stat-item-row i{font-size:16px;color:var(--accent-lavender)}
.stat-number-row{font-weight:700;color:var(--text-primary);margin-left:2px}
.btn-outline-modern{position:relative;overflow:hidden;background:transparent;border:1.5px solid var(--accent-soft-purple);color:var(--accent-lavender);border-radius:var(--button-radius);padding:10px 16px;font-size:14px;font-weight:700;width:100%;cursor:pointer;transition:var(--transition-smooth);backdrop-filter:var(--blur-lg);display:flex;align-items:center;justify-content:center;gap:var(--space-1)}
.btn-outline-modern:active{background:rgba(159,139,255,0.2);border-color:var(--accent-lavender)}
.menu-icon{position:absolute;top:var(--space-3);left:15px;font-size:26px;color:var(--accent-lavender);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition-smooth)}

.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-avatar i{font-size:20px;color:#fff}
.chat-user-text{font-weight:700;font-size:16px}
.chat-header-left{display:flex;align-items:center;gap:10px}
.chat-menu-icon{font-size:24px;color:var(--accent-lavender);cursor:pointer;padding:var(--space-1);border-radius:50%;transition:var(--transition-smooth)}
.chat-menu-icon:active{background:rgba(199,185,255,0.15)}
.typing-indicator-bottom{padding:5px 20px;font-size:12px;color:var(--accent-lavender);display:flex;align-items:center;gap:5px;opacity:0;transition:opacity 0.2s;min-height:22px}

.chat-messages-modern{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.message-wrapper-modern{display:flex;flex-direction:column;max-width:80%;position:relative}

            function createRipple(event) {
                const button = event.currentTarget;
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${event.clientX - button.offsetLeft - radius}px`;
                circle.style.top = `${event.clientY - button.offsetTop - radius}px`;
                circle.classList.add('ripple');

                let rippleContainer = button.querySelector('.ripple-container');
                if (!rippleContainer) {
                    rippleContainer = document.createElement('span');
                    rippleContainer.classList.add('ripple-container');
                    button.appendChild(rippleContainer);
                }
                rippleContainer.appendChild(circle);
                setTimeout(() => circle.remove(), 600);
            }

            function timeAgo(date) {
                const now = new Date();
                const diff = Math.floor((now - new Date(date)) / 1000);
                if (diff < 60) return currentLang === 'ar' ? 'منذ لحظات' : 'just now';
                if (diff < 3600) return currentLang === 'ar' ? `منذ ${Math.floor(diff / 60)} دقيقة` : `${Math.floor(diff / 60)} min ago`;
                if (diff < 86400) return currentLang === 'ar' ? `منذ ${Math.floor(diff / 3600)} ساعة` : `${Math.floor(diff / 3600)} hour ago`;
                return currentLang === 'ar' ? `منذ ${Math.floor(diff / 86400)} يوم` : `${Math.floor(diff / 86400)} day ago`;
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            window.go = function(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            };

            window.switchTab = function(tabId, el) {
                const homeTab = document.getElementById('home-tab');
                const searchTab = document.getElementById('search-tab');
                const convTab = document.getElementById('conversations-tab');
                const profileTab = document.getElementById('profile-tab');

                if (homeTab) homeTab.classList.toggle('active', tabId === 'home-tab');
                if (searchTab) searchTab.classList.toggle('active', tabId === 'search-tab');
                if (convTab) convTab.classList.toggle('active', tabId === 'conversations-tab');
                if (profileTab) profileTab.classList.toggle('active', tabId === 'profile-tab');

                document.querySelectorAll('.nav-item-modern').forEach(i => i.classList.remove('active'));
                if (!el) {
                    el = document.querySelector(`.nav-item-modern[onclick*="${tabId}"]`);
                }
                if (el) el.classList.add('active');

                if (tabId === 'home-tab') loadHomeFeed();
                else if (tabId === 'conversations-tab') loadConversations();
                else if (tabId === 'profile-tab') loadProfileData();
            };

            window.openConversationsScreen = function() { go('conversations-screen'); loadConversations(); };
            window.openNotifications = function() { go('notifications-screen'); loadNotifications(); markAllNotificationsAsRead(); };
            window.openAddReelScreen = function() { go('add-reel-screen'); };
            window.openAddStoryScreen = function() { go('add-story-screen'); };
            window.goBackToProfile = function() { go('main-screen'); switchTab('profile-tab'); loadProfileData(); };
            window.showCreateOptions = function() { document.getElementById('create-options-modal').classList.add('active'); };
            window.closeCreateOptions = function() { document.getElementById('create-options-modal').classList.remove('active'); };
            window.createReel = function() { closeCreateOptions(); openAddReelScreen(); };
            window.createStory = function() { closeCreateOptions(); openAddStoryScreen(); };

            window.doSignUp = async function() {
                const n = document.getElementById('s-name').value.trim();
                const u = document.getElementById('s-user').value.trim();
                const e = document.getElementById('s-email').value.trim();
                const p = document.getElementById('s-pass').value;
                if (!n || !u || !e || !p) return alert(currentLang === 'ar' ? "الرجاء ملء جميع الحقول" : "Please fill all fields");
                if (p.length < 6) return alert(currentLang === 'ar' ? "كلمة المرور 6 أحرف على الأقل" : "Password 6 chars min");

                const btn = document.getElementById('btn-s');
                btn.disabled = true;
                const { data: existing } = await sb.from('profiles').select('username').eq('username', u).maybeSingle();
                if (existing) { btn.disabled = false; return alert(currentLang === 'ar' ? "الاسم غير متاح" : "Username taken"); }

                const { data, error } = await sb.auth.signUp({ email: e, password: p, options: { data: { full_name: n, username: u } } });
                if (error) { btn.disabled = false; return alert(error.message); }

                if (data.user) {
                    await sb.from('profiles').insert([{ id: data.user.id, username: u, full_name: n }]);
                }
                btn.disabled = false;
                currentUser = data.user;
                updateUI(currentUser);
                go('main-screen');
                if (window.handleHashChange) window.handleHashChange();
            };

            window.doLogin = async function() {
                const e = document.getElementById('l-email').value.trim();
                const p = document.getElementById('l-pass').value;
                if (!e || !p) return alert(currentLang === 'ar' ? "أدخل البيانات" : "Enter details");

                const btn = document.getElementById('btn-l');
                btn.disabled = true;
                const { data, error } = await sb.auth.signInWithPassword({ email: e, password: p });
                btn.disabled = false;
                if (error) return alert("Error logging in");
                currentUser = data.user;
                updateUI(currentUser);
                go('main-screen');
                if (window.handleHashChange) window.handleHashChange();
            };

            window.doLogout = async function() {
                if (messagesSubscription) messagesSubscription.unsubscribe();
                if (reactionsSubscription) reactionsSubscription.unsubscribe();
                if (typingSubscription) typingSubscription.unsubscribe();
                if (storiesInterval) clearInterval(storiesInterval);
                await sb.auth.signOut();
                currentUser = null;
                closeSettingsMenu();
                go('login-screen');
            };

            async function updateUI(user) {
                if (user) {
                    const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
                    const fullName = profile?.full_name || user.user_metadata?.full_name || 'User';
                    const username = profile?.username || user.user_metadata?.username || 'user';
                    
                    document.getElementById('profile-fullname').innerText = fullName;
                    document.getElementById('profile-username').innerText = '@' + username;
                    document.getElementById('profile-bio').innerText = profile?.bio || '';
                    const avatarDiv = document.getElementById('profile-avatar');
                    avatarDiv.innerHTML = '<i class="fa-solid fa-user"></i>';
                    
                    loadProfileData();
                    loadUnreadNotificationsCount();
                    subscribeToNotifications();
                    loadBlockedUsers();
                    loadFollowingIds().then(() => { loadHomeFeed(); loadStories(); });
                    storiesInterval = setInterval(loadStories, 60000);
                }
            }

            window.setSearchFilter = function(filter) {
                currentSearchFilter = filter;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`.filter-btn[data-filter="${filter}"]`).classList.add('active');
                performSearch();
            };

            window.performSearch = async function() {
                const q = document.getElementById('search-input').value.trim();
                const res = document.getElementById('search-results-container');
                if (!q) { res.innerHTML = ''; return; }
                res.innerHTML = '<div style="text-align:center; padding:30px;"><i class="fa-solid fa-spinner fa-spin"></i></div>';

                if (currentSearchFilter === 'users') {
                    const { data, error } = await sb.from('profiles').select('*').ilike('username', `%${q}%`).limit(20);
                    if (error || !data || data.length === 0) return res.innerHTML = 'No results';
                    let html = '';
                    data.forEach(user => {
                        if (user.id === currentUser.id) return;
                        const avatar = '<i class="fa-solid fa-user"></i>';
                        html += `<div class="card-item" onclick="window.openUserProfileScreen('${user.id}')">
                            <div class="avatar-modern">${avatar}</div>
                            <div class="item-info"><h4>${user.full_name}</h4><p>@${user.username}</p></div>
                        </div>`;
                    });
                    res.innerHTML = html;
                } else {
                    const tag = q.startsWith('#') ? q.substring(1) : q;
                    const query = currentSearchFilter === 'hashtags' ? `%#${tag}%` : `%${q}%`;
                    const { data } = await sb.from('reels').select('*, profiles:user_id(full_name)').ilike('caption', query).order('created_at', { ascending: false }).limit(20);
                    if (!data || data.length === 0) return res.innerHTML = 'No results';
                    let html = '';
                    data.forEach(reel => {
                        html += `<div class="search-video-card" onclick="window.viewReel('${reel.id}')">
                            <video src="${reel.video_url}#t=0.1" muted></video>
                            <div class="search-video-info"><h4>${reel.profiles?.full_name}</h4><p>${reel.caption.substring(0, 30)}...</p></div>
                        </div>`;
                    });
                    res.innerHTML = html;
                }
            };

            async function loadUnreadNotificationsCount() {
                if (!currentUser) return;
                const { count } = await sb.from('notifications').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id).eq('is_read', false);
                unreadNotificationsCount = count || 0;
                updateNotificationBadge();
            }

            function updateNotificationBadge() {
                const b = document.getElementById('notification-badge');
                if (unreadNotificationsCount > 0) { b.style.display = 'flex'; b.innerText = unreadNotificationsCount; } else b.style.display = 'none';
            }

            async function loadNotifications() {
                if (!currentUser) return;
                const { data } = await sb.from('notifications').select('*, from_user:from_user_id(full_name, avatar_url)').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                const list = document.getElementById('notifications-list');
                document.getElementById('notifications-loading').style.display = 'none';
                if (!data || data.length === 0) { document.getElementById('notifications-empty').style.display = 'flex'; return; }
                let html = '';
                data.forEach(n => {
                    const u = n.from_user;
                    html += `<div class="notification-item ${n.is_read?'':'unread'}" onclick="window.handleNotificationClick('${n.type}', '${n.from_user_id}')">
                        <div class="notification-icon"><i class="fa-solid fa-user"></i></div>
                        <div class="notification-content"><p><strong>${u?.full_name}</strong> interacted with you</p></div>
                        ${!n.is_read?'<div class="notification-unread"></div>':''}
                    </div>`;
                });
                list.innerHTML = html;
            }

            window.handleNotificationClick = function(type, uid) {
                sb.from('profiles').select('*').eq('id', uid).single().then(({data}) => {
                    if(data) openChat(data.id, data.full_name, data.username, data.avatar_url);
                });
            };

            async function markAllNotificationsAsRead() {
                if(!currentUser) return;
                await sb.from('notifications').update({is_read:true}).eq('user_id', currentUser.id).eq('is_read',false);
                unreadNotificationsCount = 0; updateNotificationBadge();
            }

            function subscribeToNotifications() {
                if(!currentUser) return;
                sb.channel('notif').on('postgres_changes', {event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${currentUser.id}`}, () => {
                    loadUnreadNotificationsCount();
                    if(document.getElementById('notifications-screen').classList.contains('active')) loadNotifications();
                }).subscribe();
            }

            async function createNotification(userId, type, fromUserId, reelId=null, commentId=null) {
                if(userId === fromUserId) return;
                await sb.from('notifications').insert([{user_id:userId, type, from_user_id:fromUserId, reel_id:reelId, comment_id:commentId}]);
            }
            async function loadConversations() {
                if(!currentUser) return;
                const { data: messages } = await sb.from('messages').select('*').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at', { ascending: false });
                
                const cLoading = document.getElementById('conversations-loading');
                const cLoadingTab = document.getElementById('conversations-loading-tab');
                if (cLoading) cLoading.style.display = 'none';
                if (cLoadingTab) cLoadingTab.style.display = 'none';

                const cEmpty = document.getElementById('conversations-empty');
                const cEmptyTab = document.getElementById('conversations-empty-tab');

                if(!messages || messages.length === 0) { 
                    if (cEmpty) cEmpty.style.display = 'flex'; 
                    if (cEmptyTab) cEmptyTab.style.display = 'flex'; 
                    return; 
                }
                if (cEmpty) cEmpty.style.display = 'none';
                if (cEmptyTab) cEmptyTab.style.display = 'none';

                const convs = new Map();
                messages.forEach(m => { const id = m.sender_id===currentUser.id ? m.receiver_id : m.sender_id; if(!convs.has(id)) convs.set(id, m); });
                const { data: profiles } = await sb.from('profiles').select('*').in('id', Array.from(convs.keys()));
                const pMap = {}; if(profiles) profiles.forEach(p => pMap[p.id] = p);
                let html = '';
                convs.forEach((m, uid) => {
                    const p = pMap[uid] || {};
                    html += `<div class="card-item" onclick="window.openChat('${uid}', '${p.full_name}', '${p.username}', '')">
                        <div class="avatar-modern"><i class="fa-solid fa-user"></i></div>
                        <div class="item-info"><h4>${p.full_name||'User'}</h4><p>${m.content||'Media'}</p></div>
                    </div>`;
                });
                const cList = document.getElementById('conversations-list');
                const cListTab = document.getElementById('conversations-list-tab');
                if (cList) cList.innerHTML = html;
                if (cListTab) cListTab.innerHTML = html;
            }

            window.openChat = function(id, name, user, ava) {
                currentChatUser = { id, name, user, ava };
                document.getElementById('chat-username').innerText = name;
                document.getElementById('chat-avatar').innerHTML = '<i class="fa-solid fa-user"></i>';
                loadMessages();
                go('chat-screen');
            };

            async function loadMessages() {
                const msgsDiv = document.getElementById('chat-messages');
                msgsDiv.innerHTML = 'Loading...';
                const { data } = await sb.from('messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: true });
                msgsDiv.innerHTML = '';
                if(data) data.forEach(m => addMessageToChat(m));
                subscribeToMessages();
            }

            function addMessageToChat(m) {
                if(messageIdsSet.has(m.id)) return;
                messageIdsSet.add(m.id);
                const isSent = m.sender_id === currentUser.id;
                const cls = isSent ? 'sent' : 'received';
                const wrap = document.createElement('div');
                wrap.className = `message-wrapper-modern ${cls}`;
                wrap.innerHTML = `<div class="message-bubble ${cls}">${m.content}</div>`;
                document.getElementById('chat-messages').appendChild(wrap);
            }

            window.sendMessage = async function() {
                const val = document.getElementById('message-input').value.trim();
                if(!val) return;
                const msg = { sender_id: currentUser.id, receiver_id: currentChatUser.id, content: val, created_at: new Date() };
                const { data } = await sb.from('messages').insert([msg]).select();
                if(data) addMessageToChat(data[0]);
                document.getElementById('message-input').value = '';
            };

            function subscribeToMessages() {
                if(messagesSubscription) messagesSubscription.unsubscribe();
                messagesSubscription = sb.channel('chat').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload => {
                    const m = payload.new;
                    if((m.sender_id===currentUser.id&&m.receiver_id===currentChatUser.id) || (m.sender_id===currentChatUser.id&&m.receiver_id===currentUser.id)) addMessageToChat(m);
                }).subscribe();
            }

            window.closeChat = function() {
                if(messagesSubscription) messagesSubscription.unsubscribe();
                go('main-screen');
            };

            async function loadFollowingIds() {
                if(!currentUser) return;
                const { data } = await sb.from('followers').select('following_id').eq('follower_id', currentUser.id);
                followingIds = new Set(data?.map(f => f.following_id) || []);
            }

            async function loadProfileData() {
                if(!currentUser) return;
                const { data: p } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
                if(p) {
                    document.getElementById('profile-fullname').innerText = p.full_name || 'User';
                    document.getElementById('profile-username').innerText = '@' + (p.username || 'user');
                    document.getElementById('profile-bio').innerText = p.bio || '';
                    if (p.website) {
                        document.getElementById('profile-website').style.display = 'flex';
                        document.getElementById('profile-website a').href = p.website;
                        document.getElementById('profile-website a').innerText = p.website.replace(/^https?:\/\//, '');
                    } else {
                        document.getElementById('profile-website').style.display = 'none';
                    }
                    if (p.is_verified) {
                        document.getElementById('profile-verified').style.display = 'inline-flex';
                    } else {
                        document.getElementById('profile-verified').style.display = 'none';
                    }
                    const avatarDiv = document.getElementById('profile-avatar');
                    avatarDiv.innerHTML = '<i class="fa-solid fa-user"></i>';
                }
                const { count: postsCount } = await sb.from('reels').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id);
                document.getElementById('profile-posts-count').innerText = postsCount || 0;
                const { count: followersCount } = await sb.from('followers').select('*', { count: 'exact', head: true }).eq('following_id', currentUser.id);
                document.getElementById('profile-followers-count').innerText = followersCount || 0;
                const { count: followingCount } = await sb.from('followers').select('*', { count: 'exact', head: true }).eq('follower_id', currentUser.id);
                document.getElementById('profile-following-count').innerText = followingCount || 0;
                
                const { data: reels } = await sb.from('reels').select('id, video_url, caption').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                const grid = document.getElementById('profile-posts-grid');
                if (!reels || reels.length === 0) { 
                    grid.innerHTML = `<div class="empty-state-modern" style="height:200px;">${currentLang === 'ar' ? 'لا توجد منشورات بعد' : 'No posts yet'}</div>`; 
                    return; 
                }
                
                let gridHtml = '';
                for (const reel of reels) {
                    const { count: viewsCount } = await sb.from('reel_views').select('*', { count: 'exact', head: true }).eq('reel_id', reel.id);
                    gridHtml += `
                    <div class="grid-post-modern" onclick="window.viewReel('${reel.id}')">
                        <video src="${reel.video_url}#t=0.1" preload="metadata" muted playsinline></video>

                        if (video) {

            async function loadStories() {
                if (!currentUser) return;
                const storiesScroll = document.getElementById('stories-scroll');
                if (!storiesScroll) return;

                const following = Array.from(followingIds);
                const userIds = [currentUser.id, ...following];

                let { data: storiesData, error } = await sb
                    .from('stories')
                    .select(`*, profiles:user_id ( full_name, username, avatar_url )`)
                    .in('user_id', userIds)
                    .gt('created_at', new Date(Date.now() - 24*60*60*1000).toISOString())
                    .order('created_at', { ascending: false });

                if (error) {
                    console.warn('Nested stories query failed, trying direct query fallback:', error);
                    const fallbackResult = await sb
                        .from('stories')
                        .select(`*`)
                        .in('user_id', userIds)
                        .gt('created_at', new Date(Date.now() - 24*60*60*1000).toISOString())
                        .order('created_at', { ascending: false });
                    if (!fallbackResult.error) {
                        storiesData = fallbackResult.data;
                    } else {
                        console.error('Fallback stories query also failed:', fallbackResult.error);
                        return;
                    }
                }

                const storiesMap = new Map();
                storiesData.forEach(story => {
                    if (!storiesMap.has(story.user_id) || new Date(story.created_at) > new Date(storiesMap.get(story.user_id).created_at)) {
                        storiesMap.set(story.user_id, story);
                    }

                const stories = Array.from(storiesMap.values());

                let html = '';
                const myStory = stories.find(s => s.user_id === currentUser.id);

            window.uploadStory = async function() {
                const file = document.getElementById('story-input').files[0];
                if (!file) return alert(currentLang === 'ar' ? 'الرجاء اختيار صورة أو فيديو' : 'Please choose an image or video');

                const btn = document.getElementById('upload-story-btn');
                btn.disabled = true; btn.innerText = currentLang === 'ar' ? 'جاري الرفع...' : 'Uploading...';

                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
                    const filePath = `stories/${fileName}`;
                    const { error: uploadError } = await sb.storage.from('stories').upload(filePath, file);
                    if (uploadError) throw new Error('Upload failed');

                    const { data: publicUrlData } = sb.storage.from('stories').getPublicUrl(filePath);
                    const mediaUrl = publicUrlData.publicUrl;
                    const mediaType = file.type.startsWith('image/') ? 'image' : 'video';

                    const { error: insertError } = await sb.from('stories').insert([{
                        user_id: currentUser.id,
                        media_url: mediaUrl,
                        media_type: mediaType,
                        created_at: new Date()
                    }]);

                    if (insertError) throw new Error('Failed to save story');

                    alert(currentLang === 'ar' ? 'تم نشر القصة بنجاح' : 'Story posted successfully');
                    go('main-screen');
                    loadStories();
                } catch (err) {
                    alert(err.message);

                    btn.disabled = false; btn.innerText = currentLang === 'ar' ? 'نشر القصة' : 'Post Story';
                }
            };

                }
                statusDiv.innerHTML = currentLang === 'ar' ? 'جاري التحقق...' : 'Checking...';
                const { data, error } = await sb.from('profiles').select('username').eq('username', username).neq('id', currentUser.id).maybeSingle();
                if (error) {
                    statusDiv.innerHTML = currentLang === 'ar' ? 'حدث خطأ' : 'Error';
                    usernameAvailable = false;
                } else if (data) {
                    statusDiv.innerHTML = currentLang === 'ar' ? 'اسم المستخدم غير متاح' : 'Username not available';
                    usernameAvailable = false;
                } else {
                    statusDiv.innerHTML = currentLang === 'ar' ? 'اسم المستخدم متاح ✓' : 'Username available ✓';
                    usernameAvailable = true;
                }
            };

            window.saveProfile = async function() {
                const fullname = document.getElementById('edit-fullname').value.trim();
                const username = document.getElementById('edit-username').value.trim();
                const bio = document.getElementById('edit-bio').value.trim();
                const website = document.getElementById('edit-website').value.trim();
                const email = document.getElementById('edit-email').value.trim();
                const password = document.getElementById('edit-password').value;
                const passwordConfirm = document.getElementById('edit-password-confirm').value;
                if (!fullname || !username || !email) return alert(currentLang === 'ar' ? 'الرجاء ملء جميع الحقول الإجبارية' : 'Please fill all required fields');
                if (password && password.length < 6) return alert(currentLang === 'ar' ? 'كلمة المرور يجب أن تكون 6 أحرف على الأقل' : 'Password must be 6 chars min');
                if (password !== passwordConfirm) return alert(currentLang === 'ar' ? 'كلمة المرور غير متطابقة' : 'Passwords do not match');

                if (!usernameAvailable) {
                    return alert(currentLang === 'ar' ? 'اسم المستخدم غير متاح' : 'Username not available');
                }

                const btn = document.getElementById('save-profile-btn');
                btn.disabled = true; btn.innerText = currentLang === 'ar' ? 'جاري الحفظ...' : 'Saving...';
                try {
                    const updates = {};
                    if (email !== currentUser.email) updates.email = email;
                    if (password) updates.password = password;
                    updates.data = { full_name: fullname, username: username };

                    if (Object.keys(updates).length > 0) {
                        const { error: authError } = await sb.auth.updateUser(updates);
                        if (authError) throw new Error(authError.message);
                    }

                    const profileUpdates = { full_name: fullname, username: username, bio: bio, website: website, updated_at: new Date() };
                    const { error: profileError } = await sb.from('profiles').update(profileUpdates).eq('id', currentUser.id);
                    if (profileError) throw new Error(profileError.message);

                    const { data: { user } } = await sb.auth.getUser();
                    currentUser = user;
                    updateUI(currentUser);
                    alert(currentLang === 'ar' ? 'تم حفظ التغييرات بنجاح' : 'Changes saved successfully');
                    goBackToProfile();
                } catch (err) { alert(err.message); }
                finally { btn.disabled = false; btn.innerText = translations[currentLang].saveChanges; }
            };

            window.openUserProfileScreen = async function(userId) {
                viewedUserId = userId;
                await loadUserProfileScreen(userId);
                go('user-profile-screen');
            };

            async function loadUserProfileScreen(userId) {
                if (!userId) return;
                const { data: profile } = await sb.from('profiles').select('*').eq('id', userId).single();
                if (!profile) return;

                document.getElementById('user-profile-fullname').innerText = profile.full_name || 'User';
                document.getElementById('user-profile-username').innerText = '@' + (profile.username || 'user');
                document.getElementById('user-profile-bio').innerText = profile.bio || '';
                if (profile.website) {
                    document.getElementById('user-profile-website').style.display = 'flex';
                    document.getElementById('user-profile-website a').href = profile.website;
                    document.getElementById('user-profile-website a').innerText = profile.website.replace(/^https?:\/\//, '');
                } else {
                    document.getElementById('user-profile-website').style.display = 'none';
                }
                if (profile.is_verified) {
                    document.getElementById('user-profile-verified').style.display = 'inline-flex';
                } else {
                    document.getElementById('user-profile-verified').style.display = 'none';
                }
                document.getElementById('user-profile-avatar').innerHTML = '<i class="fa-solid fa-user"></i>';

                const { count: postsCount } = await sb.from('reels').select('*', { count: 'exact', head: true }).eq('user_id', userId);
                document.getElementById('user-posts-count').innerText = postsCount || 0;
                const { count: followersCount } = await sb.from('followers').select('*', { count: 'exact', head: true }).eq('following_id', userId);
                document.getElementById('user-followers-count').innerText = followersCount || 0;
                const { count: followingCount } = await sb.from('followers').select('*', { count: 'exact', head: true }).eq('follower_id', userId);
                document.getElementById('user-following-count').innerText = followingCount || 0;

                const followBtn = document.getElementById('user-profile-follow-btn');
                if (userId === currentUser.id) {
                    followBtn.style.display = 'none';
                } else {
                    followBtn.style.display = 'block';
                    const isFollowing = followingIds.has(userId);
                    followBtn.innerText = isFollowing ? (currentLang === 'ar' ? 'متابَع' : 'Following') : (currentLang === 'ar' ? 'متابعة' : 'Follow');
                    followBtn.classList.toggle('following', isFollowing);
                }

                const { data: reels } = await sb.from('reels').select('id, video_url, caption').eq('user_id', userId).order('created_at', { ascending: false });
                const grid = document.getElementById('user-posts-grid');
                if (!reels || reels.length === 0) { 
                    grid.innerHTML = `<div class="empty-state-modern" style="height:200px;">${currentLang === 'ar' ? 'لا توجد منشورات' : 'No posts'}</div>`; 
                    return; 
                }
                let gridHtml = '';
                for (const reel of reels) {
                    const { count: viewsCount } = await sb.from('reel_views').select('*', { count: 'exact', head: true }).eq('reel_id', reel.id);
                    gridHtml += `
                        <div class="user-grid-post" onclick="window.viewReel('${reel.id}')">
                            <video src="${reel.video_url}#t=0.1" preload="metadata" muted playsinline></video>
                            <div class="user-grid-overlay">
                                <i class="fa-solid fa-play"></i> ${viewsCount || 0}
                            </div>
                        </div>`;
                }
                grid.innerHTML = gridHtml;
            }

            window.toggleFollowFromUserProfile = async function() {
                if (!viewedUserId) return;
                const isFollowing = followingIds.has(viewedUserId);
                if (isFollowing) {
                    await sb.from('followers').delete().eq('follower_id', currentUser.id).eq('following_id', viewedUserId);
                    followingIds.delete(viewedUserId);
                } else {
                    await sb.from('followers').insert([{ follower_id: currentUser.id, following_id: viewedUserId }]);
                    followingIds.add(viewedUserId);
                }
                loadUserProfileScreen(viewedUserId);
            };

            window.messageUserFromProfile = function() {
                if (!viewedUserId) return;
                sb.from('profiles').select('*').eq('id', viewedUserId).single().then(({ data }) => {
                    if (data) {
                        openChat(data.id, data.full_name, data.username, data.avatar_url);
                    }
                });
            };

            window.goBackFromUserProfile = function() {
                go('main-screen');
            };

            window.openSettingsMenu = function() { 
                document.getElementById('settings-menu').classList.add('open'); 
                document.getElementById('settings-overlay').classList.add('active'); 
            };
            window.closeSettingsMenu = function() { 
                document.getElementById('settings-menu').classList.remove('open'); 
                document.getElementById('settings-overlay').classList.remove('active'); 
            };
            window.openPrivacyPolicy = function() { 
                document.getElementById('privacy-modal').classList.add('active'); 
                closeSettingsMenu(); 
            };
            window.closePrivacyPolicy = function() { 
                document.getElementById('privacy-modal').classList.remove('active'); 
            };

            window.openChatUserOptions = function() {
                if (!currentChatUser) return;
                document.getElementById('chat-options-modal').classList.add('active');
            };

            window.closeChatOptionsModal = function() {
                document.getElementById('chat-options-modal').classList.remove('active');
            };

            window.viewChatUserProfile = async function() {
                closeChatOptionsModal();
                if (!currentChatUser) return;
                openUserProfileScreen(currentChatUser.id);
            };

            window.blockUser = async function() {
                if (!currentChatUser || currentChatUser.id === currentUser.id) return;
                if (!confirm(currentLang === 'ar' ? `هل أنت متأكد من حظر هذا المستخدم؟` : `Are you sure you want to block this user?`)) return;

                await sb.from('blocks').insert([
                    { blocker_id: currentUser.id, blocked_id: currentChatUser.id, created_at: new Date() }
                ]);

                blockedUsers.add(currentChatUser.id);
                alert(currentLang === 'ar' ? `تم حظر المستخدم` : `User blocked`);
                closeChatOptionsModal();
                closeChat();
            };

            async function loadBlockedUsers() {
                if (!currentUser) return;
                const { data } = await sb.from('blocks').select('blocked_id').eq('blocker_id', currentUser.id);
                if (data) {
                    blockedUsers = new Set(data.map(b => b.blocked_id));
                }
            }

            window.openBlockedUsersScreen = async function() {
                closeSettingsMenu();
                go('blocked-users-screen');
                await loadBlockedUsersList();
            };

            async function loadBlockedUsersList() {
                if (!currentUser) return;
                const listDiv = document.getElementById('blocked-users-list');
                const loading = document.getElementById('blocked-loading');
                const empty = document.getElementById('blocked-empty');
                loading.style.display = 'flex';
                empty.style.display = 'none';
                listDiv.innerHTML = '';
                listDiv.appendChild(loading);

                const { data: blocks, error } = await sb
                    .from('blocks')
                    .select(`blocked_id, profiles:blocked_id ( id, full_name, username, avatar_url )`)
                    .eq('blocker_id', currentUser.id);

                loading.style.display = 'none';
                if (error || !blocks || blocks.length === 0) {
                    empty.style.display = 'flex';
                    return;
                }

                let html = '';
                blocks.forEach(block => {
                    const user = block.profiles;
                    if (!user) return;
                    html += `
                        <div class="blocked-item">
                            <div class="avatar-modern" style="width:50px; height:50px;"><i class="fa-solid fa-user" style="color: white; font-size: 20px;"></i></div>
                            <div class="blocked-info">
                                <h4>${user.full_name}</h4>
                                <p>@${user.username}</p>
                            </div>
                            <button class="unblock-btn" onclick="window.unblockUser('${user.id}')">${currentLang === 'ar' ? 'إلغاء الحظر' : 'Unblock'}</button>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            }

            window.unblockUser = async function(blockedId) {
                if (!confirm(currentLang === 'ar' ? 'هل تريد إلغاء حظر هذا المستخدم؟' : 'Unblock this user?')) return;
                await sb.from('blocks').delete().eq('blocker_id', currentUser.id).eq('blocked_id', blockedId);
                blockedUsers.delete(blockedId);
                loadBlockedUsersList();
            };

            function showConversationContextMenu(event, otherUserId, otherUserName) {
                const menu = document.getElementById('conversation-context-menu');
                menu.innerHTML = `<button class="delete-conv" onclick="window.deleteConversation('${otherUserId}', '${otherUserName}')">🗑️ ${currentLang === 'ar' ? 'حذف المحادثة مع ' : 'Delete conversation with '}${otherUserName}</button>`;
                menu.style.display = 'block';
                menu.style.left = event.pageX + 'px';
                menu.style.top = event.pageY + 'px';

                const hideMenu = (e) => {
                    if (!menu.contains(e.target)) {
                        menu.style.display = 'none';
                        document.removeEventListener('click', hideMenu);
                    }
                };
                setTimeout(() => document.addEventListener('click', hideMenu), 100);
            }

            window.deleteConversation = async function(otherUserId, otherUserName) {
                if (!confirm(currentLang === 'ar' ? `هل أنت متأكد من حذف المحادثة مع ${otherUserName}؟` : `Delete conversation with ${otherUserName}?`)) return;
                await sb.from('messages')
                    .delete()
                    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`);
                alert(currentLang === 'ar' ? 'تم حذف المحادثة' : 'Conversation deleted');
                document.getElementById('conversation-context-menu').style.display = 'none';
                loadConversations();
            };

            function subscribeToAllIncomingMessages() {
                if (!currentUser) return;
                sb.channel('global-messages')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `receiver_id=eq.${currentUser.id}` 
                    }, () => {
                        loadConversations(); 
                    })
                    .subscribe();
            }

            window.uploadReel = async function() {
                const file = document.getElementById('video-input').files[0];
                const caption = document.getElementById('reel-caption').value.trim();
                if (!file || !caption) return alert(currentLang === 'ar' ? 'الرجاء اختيار فيديو ووصف' : 'Please choose video and caption');

                const btn = document.getElementById('upload-reel-btn');
                btn.disabled = true; btn.innerText = currentLang === 'ar' ? 'جاري الرفع...' : 'Uploading...';

                try {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
                    const filePath = `reels/${fileName}`;

                    const { error: uploadError } = await sb.storage.from('reels').upload(filePath, file);
                    if (uploadError) throw new Error('Upload failed: ' + uploadError.message);

                    const { data: publicUrlData } = sb.storage.from('reels').getPublicUrl(filePath);
                    const videoUrl = publicUrlData.publicUrl;

                    const { error: insertError } = await sb.from('reels').insert([{
                        user_id: currentUser.id,
                        video_url: videoUrl,
                        caption: caption,
                        created_at: new Date()
                    }]);

                    if (insertError) throw new Error('Failed to save reel: ' + insertError.message);

                    alert(currentLang === 'ar' ? '✅ تم نشر المنشور بنجاح' : '✅ Post published successfully');
                    go('main-screen');
                    loadShorts(true);
                    loadHomeFeed();
                    loadProfileData();
                } catch (err) {
                    alert(err.message);
                } finally {
                    btn.disabled = false; btn.innerText = currentLang === 'ar' ? 'نشر المنشور' : 'Post';
                }
            };

            window.searchByHashtag = function(tag) {
                switchTab('search-tab');
                document.getElementById('search-input').value = '#' + tag;
                setSearchFilter('hashtags');
                performSearch();
            };

            window.searchByUsername = function(username) {
                switchTab('search-tab');
                document.getElementById('search-input').value = '@' + username;
                setSearchFilter('users');
                performSearch();
            };

            async function initSupabaseAndStart() {
                if (window.supabase) {
                    try {
                        sb = window.supabase.createClient(S_URL, S_KEY);
                        buildUI();
                        
                        document.getElementById('video-input')?.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = function(ev) { 
                                    document.getElementById('video-preview').innerHTML = `<video src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover;"></video>`; 
                                };
                                reader.readAsDataURL(file);
                            }
                        });
                        document.getElementById('story-input')?.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = function(ev) {
                                    if (file.type.startsWith('image/')) {
                                        document.getElementById('story-preview').innerHTML = `<img src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                                    } else {
                                        document.getElementById('story-preview').innerHTML = `<video src="${ev.target.result}" style="width:100%; height:100%; object-fit:cover;"></video>`;
                                    }
                                };
                                reader.readAsDataURL(file);
                            }
                        });
                        document.getElementById('avatar-input')?.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (file) { 
                                const reader = new FileReader(); 
                                reader.onload = function(ev) { 
                                    document.getElementById('avatar-preview').innerHTML = `<img src="${ev.target.result}" alt="avatar">`; 
                                }; 
                                reader.readAsDataURL(file); 
                            }
                        });
                        document.getElementById('chat-file-input')?.addEventListener('change', function(e) {
                            if (e.target.files.length > 0) { 
                                selectedFile = e.target.files[0]; 
                                alert(currentLang === 'ar' ? 'تم اختيار الملف: ' + selectedFile.name + '. اضغط إرسال.' : 'File selected: ' + selectedFile.name + '. Press send.'); 
                            }
                        });

                        document.getElementById('share-modal')?.addEventListener('click', function(e) { if (e.target === this) closeShareModal(); });
                        document.getElementById('privacy-modal')?.addEventListener('click', function(e) { if (e.target === this) closePrivacyPolicy(); });
                        document.getElementById('chat-options-modal')?.addEventListener('click', function(e) { if (e.target === this) closeChatOptionsModal(); });
                        document.getElementById('user-profile-modal')?.addEventListener('click', function(e) { if (e.target === this) closeUserProfileModal(); });
                        document.getElementById('create-options-modal')?.addEventListener('click', function(e) { if (e.target === this) closeCreateOptions(); });

                        const { data: { session } } = await sb.auth.getSession();
                        if (session) { 
                            currentUser = session.user; 
                            updateUI(currentUser); 
                            go('main-screen'); 
                            loadConversations(); 
                            subscribeToAllIncomingMessages(); 
                        }
                        updateUILanguage();
                        window.handleHashChange();
                    } catch (err) {
                        console.error("Supabase init error:", err);
                        showFatalError("فشل تهيئة الاتصال بقاعدة البيانات: " + err.message);
                    }
                } else {
                    if (retryCount < maxRetries) {
                        retryCount++;
                        setTimeout(initSupabaseAndStart, 500);
                    } else {
                        showFatalError("مكتبة قاعدة البيانات (Supabase) غير متوفرة. يرجى التحقق من اتصال الإنترنت وإعادة المحاولة.");
                    }
                }
            }

            window.handleHashChange = function() {
                const hash = window.location.hash;
                if (!currentUser) return;
                go('main-screen');
                if (hash === '#profile' || hash.includes('profile')) {
                    switchTab('profile-tab');
                }
            };
            window.addEventListener('hashchange', window.handleHashChange);

            // Initialize loading state and start
            setTimeout(() => {
                showLoader();
                initSupabaseAndStart();
            }, 100);

        })();
    </script>
</body>
</html>
